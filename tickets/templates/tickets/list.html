{% extends "tickets/base.html" %}
{% block content %}

<h2>My incident tickets</h2>

<p><a class="btn" href="/tickets/new/">+ New ticket</a></p>

<table>
  <tr>
    <th>#</th>
    <th>Title</th>
    <th>Severity</th>
    <th>Actions</th>
  </tr>

  {% for t in tickets %}
  <tr>
    <td>{{ t.pk }}</td>

    <td>
      <a href="/tickets/{{ t.pk }}/" style="color:#3be07a">
        {{ t.title }}
      </a>
    </td>

    <td class="sev-{{ t.severity }}">
      {{ t.get_severity_display }}
    </td>

    <td>
      <form method="POST" action="/tickets/{{ t.pk }}/delete/">
        {% csrf_token %}
        <button type="submit">Delete</button>
      </form>
    </td>
  </tr>

  {% empty %}
  <tr>
    <td colspan="4">No tickets yet.</td>
  </tr>
  {% endfor %}

</table>

{% endblock %}
